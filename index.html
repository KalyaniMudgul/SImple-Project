<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Valentine ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 10px;
        }

        p {
            color: #444;
            font-size: 16px;
        }

        .heart {
            font-size: 60px;
            animation: beat 1s infinite;
            margin: 15px 0;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #e63950;
        }

        .hidden-message {
            display: none;
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Happy Valentine’s Day ❤️</h1>
    <p>To the one who makes my world beautiful</p>

    <div class="heart">❤️</div>

    <button onclick="showMessage()">Click for a surprise</button>

    <div class="hidden-message" id="message">
        <p>
            You are not just special today,<br>
            you are special every single day 💕<br><br>
            Thank you for being YOU 🌸<br>
            Forever & Always ❤️
        </p>
    </div>
</div>

<script>
    function showMessage() {
        document.getElementById("message").style.display = "block";
    }
</script>

</body>
</html>
